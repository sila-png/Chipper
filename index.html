<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>AR Hiro Marker - Running Tigers</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      width: min(92vw, 520px);
      padding: 12px 16px;

      border-radius: 14px;
      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 16px;
      line-height: 1.4;

      backdrop-filter: blur(5px);
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      z-index: 20;

      display: flex;
      justify-content: center;
      padding: 0 12px;
    }

    button {
      min-width: 190px;
      min-height: 52px;

      border: none;
      border-radius: 14px;

      background: #ff9800;
      color: white;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>

  <script>

    /* ============================================================
       ตัวแปรความเร็วกลางของเสือ
       ============================================================ */

    window.tigerSpeed = 1;


    /* ============================================================
       COMPONENT: Running Tiger
       ============================================================ */

    AFRAME.registerComponent('running-tiger', {

      schema: {
        offset: {
          type: 'number',
          default: 0
        },

        color: {
          type: 'color',
          default: '#f59e0b'
        }
      },

      init: function () {

        this.time = this.data.offset;

        /*
         * เก็บชิ้นส่วนของตัวเสือ
         */
        this.body = this.el.querySelector('.tiger-body');
        this.head = this.el.querySelector('.tiger-head');

        this.frontLeft =
          this.el.querySelector('.front-left');

        this.frontRight =
          this.el.querySelector('.front-right');

        this.backLeft =
          this.el.querySelector('.back-left');

        this.backRight =
          this.el.querySelector('.back-right');

        this.tail =
          this.el.querySelector('.tiger-tail');
      },


      tick: function (time, delta) {

        if (!delta) return;

        /*
         * ความเร็วจะเพิ่มตามปุ่ม
         */
        const speed = window.tigerSpeed || 1;

        /*
         * Animation time
         */
        this.time += delta * 0.015 * speed;


        /*
         * ========================================================
         * ขยับขาแบบวิ่ง
         * ========================================================
         */

        const legSwing =
          Math.sin(this.time * 2.5) * 0.55;

        const oppositeSwing =
          Math.sin(this.time * 2.5 + Math.PI) * 0.55;


        if (this.frontLeft) {
          this.frontLeft.object3D.rotation.x =
            legSwing;
        }

        if (this.frontRight) {
          this.frontRight.object3D.rotation.x =
            oppositeSwing;
        }

        if (this.backLeft) {
          this.backLeft.object3D.rotation.x =
            oppositeSwing;
        }

        if (this.backRight) {
          this.backRight.object3D.rotation.x =
            legSwing;
        }


        /*
         * ========================================================
         * ขยับตัวขึ้นลงเล็กน้อย
         * ========================================================
         */

        if (this.body) {

          this.body.object3D.position.y =
            0.48 +
            Math.abs(
              Math.sin(this.time * 2.5)
            ) * 0.025;

        }


        /*
         * ========================================================
         * ขยับหาง
         * ========================================================
         */

        if (this.tail) {

          this.tail.object3D.rotation.y =
            Math.sin(this.time * 3) * 0.35;

        }


        /*
         * ขยับหัวเล็กน้อย
         */

        if (this.head) {

          this.head.object3D.rotation.z =
            Math.sin(this.time * 2.5) * 0.04;

        }
      }
    });


    /* ============================================================
       เมื่อเว็บโหลดเสร็จ
       ============================================================ */

    window.addEventListener('DOMContentLoaded', () => {

      const marker =
        document.querySelector('#hiro-marker');

      const topPanel =
        document.querySelector('#top-panel');

      const speedButton =
        document.querySelector('#speed-button');


      /* ==========================================================
         เมื่อเจอ Hiro Marker
         ========================================================== */

      marker.addEventListener('markerFound', () => {

        topPanel.innerHTML =
          '🐯🐯 พบ Hiro Marker แล้ว!' +
          '<span class="hint">' +
          'เสือ 2 ตัวกำลังวิ่งอยู่กับที่' +
          '</span>';

      });


      /* ==========================================================
         เมื่อ Marker หาย
         ========================================================== */

      marker.addEventListener('markerLost', () => {

        topPanel.innerHTML =
          '📷 เล็งกล้องไปที่ Hiro Marker' +
          '<span class="hint">' +
          'วาง Marker ให้เห็นกรอบดำครบทั้งสี่ด้าน' +
          '</span>';

      });


      /* ==========================================================
         ปุ่มเพิ่มความเร็ว
         ========================================================== */

      speedButton.addEventListener('click', () => {

        window.tigerSpeed += 0.5;

        speedButton.textContent =
          '⚡ เพิ่มความเร็ว (' +
          window.tigerSpeed.toFixed(1) +
          'x)';

      });

    });

  </script>
</head>


<body>

  <!-- ==========================================================
       UI ด้านบน
       ========================================================== -->

  <div id="top-panel">

    📷 เล็งกล้องไปที่ Hiro Marker

    <span class="hint">
      อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม
    </span>

  </div>


  <!-- ==========================================================
       ปุ่มควบคุม
       ========================================================== -->

  <div id="controls">

    <button id="speed-button" type="button">
      ⚡ เพิ่มความเร็ว (1.0x)
    </button>

  </div>


  <!-- ==========================================================
       A-FRAME + AR.JS
       ========================================================== -->

  <a-scene
    embedded

    vr-mode-ui="enabled: false"

    renderer="
      logarithmicDepthBuffer: true;
      antialias: true;
      colorManagement: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
  >


    <!-- ========================================================
         HIRO MARKER
         ======================================================== -->

    <a-marker
      id="hiro-marker"

      preset="hiro"

      emitevents="true"

      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >


      <!-- ======================================================
           พื้นสนาม
           ====================================================== -->

      <a-cylinder
        position="0 0.03 0"
        radius="1.25"
        height="0.05"
        color="#4e342e"
      ></a-cylinder>


      <!-- ======================================================
           TIGER 1
           ====================================================== -->

      <a-entity
        position="-0.55 0 0"
        rotation="0 25 0"
        running-tiger="offset: 0"
      >

        <!-- ลำตัว -->
        <a-box
          class="tiger-body"
          position="0 0.48 0"
          width="0.75"
          height="0.35"
          depth="0.32"
          color="#f59e0b"
        ></a-box>


        <!-- ลายดำ -->
        <a-box
          position="-0.18 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>

        <a-box
          position="0.02 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>

        <a-box
          position="0.20 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>


        <!-- หัว -->
        <a-box
          class="tiger-head"
          position="0.48 0.58 0"
          width="0.32"
          height="0.32"
          depth="0.30"
          color="#ffb300"
        ></a-box>


        <!-- หู -->
        <a-cone
          position="0.40 0.78 0.10"
          radius-bottom="0.08"
          height="0.15"
          color="#f57c00"
        ></a-cone>

        <a-cone
          position="0.40 0.78 -0.10"
          radius-bottom="0.08"
          height="0.15"
          color="#f57c00"
        ></a-cone>


        <!-- ตา -->
        <a-sphere
          position="0.65 0.64 0.10"
          radius="0.035"
          color="#111111"
        ></a-sphere>

        <a-sphere
          position="0.65 0.64 -0.10"
          radius="0.035"
          color="#111111"
        ></a-sphere>


        <!-- จมูก -->
        <a-sphere
          position="0.66 0.55 0"
          radius="0.045"
          color="#212121"
        ></a-sphere>


        <!-- ขาหน้า -->
        <a-box
          class="front-left"
          position="0.25 0.22 0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#f59e0b"
        ></a-box>

        <a-box
          class="front-right"
          position="0.25 0.22 -0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#f59e0b"
        ></a-box>


        <!-- ขาหลัง -->
        <a-box
          class="back-left"
          position="-0.25 0.22 0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#f59e0b"
        ></a-box>

        <a-box
          class="back-right"
          position="-0.25 0.22 -0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#f59e0b"
        ></a-box>


        <!-- หาง -->
        <a-cylinder
          class="tiger-tail"
          position="-0.48 0.57 0"
          radius="0.045"
          height="0.55"
          rotation="0 0 65"
          color="#f59e0b"
        ></a-cylinder>

      </a-entity>


      <!-- ======================================================
           TIGER 2
           ====================================================== -->

      <a-entity
        position="0.55 0 0"
        rotation="0 -25 0"
        running-tiger="offset: 3.14"
      >

        <!-- ลำตัว -->
        <a-box
          class="tiger-body"
          position="0 0.48 0"
          width="0.75"
          height="0.35"
          depth="0.32"
          color="#ef6c00"
        ></a-box>


        <!-- ลายดำ -->
        <a-box
          position="-0.18 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>

        <a-box
          position="0.02 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>

        <a-box
          position="0.20 0.48 0.166"
          width="0.07"
          height="0.30"
          depth="0.015"
          color="#212121"
        ></a-box>


        <!-- หัว -->
        <a-box
          class="tiger-head"
          position="0.48 0.58 0"
          width="0.32"
          height="0.32"
          depth="0.30"
          color="#ff9800"
        ></a-box>


        <!-- หู -->
        <a-cone
          position="0.40 0.78 0.10"
          radius-bottom="0.08"
          height="0.15"
          color="#e65100"
        ></a-cone>

        <a-cone
          position="0.40 0.78 -0.10"
          radius-bottom="0.08"
          height="0.15"
          color="#e65100"
        ></a-cone>


        <!-- ตา -->
        <a-sphere
          position="0.65 0.64 0.10"
          radius="0.035"
          color="#111111"
        ></a-sphere>

        <a-sphere
          position="0.65 0.64 -0.10"
          radius="0.035"
          color="#111111"
        ></a-sphere>


        <!-- จมูก -->
        <a-sphere
          position="0.66 0.55 0"
          radius="0.045"
          color="#212121"
        ></a-sphere>


        <!-- ขาหน้า -->
        <a-box
          class="front-left"
          position="0.25 0.22 0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#ef6c00"
        ></a-box>

        <a-box
          class="front-right"
          position="0.25 0.22 -0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#ef6c00"
        ></a-box>


        <!-- ขาหลัง -->
        <a-box
          class="back-left"
          position="-0.25 0.22 0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#ef6c00"
        ></a-box>

        <a-box
          class="back-right"
          position="-0.25 0.22 -0.11"
          width="0.13"
          height="0.42"
          depth="0.12"
          color="#ef6c00"
        ></a-box>


        <!-- หาง -->
        <a-cylinder
          class="tiger-tail"
          position="-0.48 0.57 0"
          radius="0.045"
          height="0.55"
          rotation="0 0 65"
          color="#ef6c00"
        ></a-cylinder>

      </a-entity>


    </a-marker>


    <!-- กล้อง -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
